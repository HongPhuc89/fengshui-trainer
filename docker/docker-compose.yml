services:
  web:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload --timeout 3600
    volumes:
      - ../src/backend:/app/src/backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      # - db
      - redis

  celery_worker:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ../src/backend:/app/src/backend
    env_file:
      - .env
    depends_on:
      - web
      - redis

  celery_beat:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ../src/backend:/app/src/backend
    env_file:
      - .env
    depends_on:
      - web
      - redis

  # db:
  #   image: postgres:17
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_DB=fengshui_dev
  #   ports:
  #     - "5489:5432"

  redis:
    image: redis:8.6-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI


volumes:
  postgres_data:
