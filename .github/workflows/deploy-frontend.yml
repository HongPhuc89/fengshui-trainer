name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build
        working-directory: src/frontend
        run: npm run build

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools@13.29.1

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project fengshui-trainer8x-mobile
        working-directory: src/frontend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
