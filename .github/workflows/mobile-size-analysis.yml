name: Mobile Size Analysis

on:
  workflow_dispatch:

jobs:
  size-analysis:
    name: Build APK & Analyze Size
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      - name: Create env config
        run: echo '${{ secrets.MOBILE_ENV_PROD_JSON }}' > src/mobile/env.prod.json

      - name: Install dependencies
        run: make mobile-install

      - name: Bump version and build release APK
        run: make mobile-build-apk-prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: src/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | CLI_VERSION=2.58.2 bash

      - name: Upload size analysis to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: scottfu89
          SENTRY_PROJECT: fengshui-trainer-mobile
        run: |
          sentry-cli build upload src/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --build-configuration Release
