<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt lại mật khẩu — Thiên Thư</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f0; font-family: 'Segoe UI', Arial, sans-serif; color: #333;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f0; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width: 480px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color: #1a1a1a; padding: 24px 32px; text-align: center;">
              <h1 style="margin: 0; color: #c9a84c; font-size: 1.4rem; font-weight: 700; letter-spacing: 1px;">
                Thiên Thư
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 32px;">
              <p style="margin: 0 0 16px; font-size: 1rem; color: #333;">
                Xin chào <strong>{{ display_name }}</strong>,
              </p>
              <p style="margin: 0 0 24px; font-size: 0.95rem; color: #555; line-height: 1.6;">
                Bạn vừa yêu cầu đặt lại mật khẩu. Đây là mã OTP của bạn:
              </p>

              <!-- OTP box -->
              <div style="background-color: #fdf6e3; border: 2px solid #c9a84c; border-radius: 10px; padding: 20px 32px; text-align: center; margin: 0 0 24px;">
                <span style="font-size: 2.4rem; font-weight: 800; letter-spacing: 12px; color: #1a1a1a; font-family: 'Courier New', monospace;">
                  {{ otp_code }}
                </span>
              </div>

              <p style="margin: 0 0 24px; font-size: 0.9rem; color: #555; text-align: center;">
                Mã có hiệu lực trong <strong>{{ expiry_minutes }} phút</strong>.
              </p>

              <p style="margin: 0; font-size: 0.85rem; color: #888; line-height: 1.5;">
                Nếu bạn không yêu cầu đặt lại mật khẩu, hãy bỏ qua email này. Tài khoản của bạn vẫn an toàn.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #f5f5f0; padding: 16px 32px; text-align: center; border-top: 1px solid #e8e8e0;">
              <p style="margin: 0; font-size: 0.75rem; color: #aaa;">
                &copy; Thiên Thư — Nền tảng học Phong Thuỷ
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
